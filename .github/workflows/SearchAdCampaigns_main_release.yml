name: SearchAdCampaigns main release
permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - 'Frends.LinkedIn.SearchAdCampaigns/**'
      - '.github/workflows/SearchAdCampaigns*.yml'
  workflow_dispatch:

jobs:
  main_pipeline:
    uses: FrendsPlatform/FrendsTasks/.github/workflows/official_task_pipeline.yml@main
    with:
      workflow_mode: main
      os: all
      workdir: Frends.LinkedIn.SearchAdCampaigns
    secrets:
      badge_service_api_key: ${{ secrets.BADGE_SERVICE_API_KEY }}
      target_feed_api_key: ${{ secrets.TASKS_FEED_API_KEY }}
